<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sky" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#7ec8f2"/>
      <stop offset="55%" stop-color="#3d94dd"/>
      <stop offset="100%" stop-color="#1c6bb0"/>
    </radialGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffdb6b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffdb6b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="45%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#f7a20c"/>
    </radialGradient>

    <linearGradient id="cloudTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4edf5"/>
    </linearGradient>

    <linearGradient id="cloudShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbe6ef"/>
      <stop offset="100%" stop-color="#aebed0"/>
    </linearGradient>

    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd0ff"/>
      <stop offset="100%" stop-color="#2f8fe0"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="url(#sky)"/>

  <!-- Sun glow (peeking upper-left) -->
  <circle cx="21" cy="18" r="15" fill="url(#sunGlow)"/>

  <!-- Sun rays -->
  <g stroke="#ffe28a" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="21" y1="2" x2="21" y2="5.5"/>
    <line x1="8" y1="7" x2="10.4" y2="9.4"/>
    <line x1="3" y1="18" x2="6.5" y2="18"/>
  </g>

  <!-- Sun body -->
  <circle cx="21" cy="18" r="9.5" fill="url(#sunBody)"/>
  <circle cx="18.5" cy="15" r="4.2" fill="#fff8dd" opacity="0.35" filter="url(#softBlur)"/>

  <!-- Cloud shadow (ground contact) -->
  <ellipse cx="34" cy="42" rx="18" ry="3" fill="#0b3a63" opacity="0.15" filter="url(#softBlur)"/>

  <!-- Cloud back puff (shaded) -->
  <g fill="url(#cloudShadow)">
    <ellipse cx="20" cy="31" rx="8.5" ry="7"/>
    <ellipse cx="46" cy="30" rx="8" ry="6.8"/>
  </g>

  <!-- Cloud main body -->
  <g fill="url(#cloudTop)">
    <ellipse cx="25" cy="27" rx="10" ry="8"/>
    <ellipse cx="37" cy="26" rx="11" ry="9"/>
    <ellipse cx="46" cy="29.5" rx="7" ry="6"/>
    <rect x="17" y="28" width="35" height="10.5" rx="5.2"/>
  </g>

  <!-- Cloud highlight -->
  <ellipse cx="33" cy="23.5" rx="8.5" ry="4" fill="#ffffff" opacity="0.7"/>

  <!-- Cloud bottom shading -->
  <path d="M18 35 Q35 41.5 51 35 L51 38 Q35 43.5 18 38 Z" fill="#a9bccf" opacity="0.5"/>

  <!-- Rain drops (left side, falling from cloud) -->
  <g fill="url(#dropGrad)">
    <path d="M22 45 C22 42.5 24 41 24 41 C24 41 26 42.5 26 45 C26 46.4 24.9 47.5 24 47.5 C23.1 47.5 22 46.4 22 45 Z"/>
    <path d="M15 50 C15 47.8 16.7 46.5 16.7 46.5 C16.7 46.5 18.4 47.8 18.4 50 C18.4 51.2 17.5 52.2 16.7 52.2 C15.9 52.2 15 51.2 15 50 Z"/>
  </g>

  <!-- Snowflakes (right side, falling from cloud) -->
  <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round">
    <g transform="translate(41,48)">
      <line x1="-4.2" y1="0" x2="4.2" y2="0"/>
      <line x1="0" y1="-4.2" x2="0" y2="4.2"/>
      <line x1="-3" y1="-3" x2="3" y2="3"/>
      <line x1="-3" y1="3" x2="3" y2="-3"/>
    </g>
    <g transform="translate(49,42) scale(0.65)">
      <line x1="-4.2" y1="0" x2="4.2" y2="0"/>
      <line x1="0" y1="-4.2" x2="0" y2="4.2"/>
      <line x1="-3" y1="-3" x2="3" y2="3"/>
      <line x1="-3" y1="3" x2="3" y2="-3"/>
    </g>
  </g>
</svg>
